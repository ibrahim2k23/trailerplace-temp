name: prefill-from-first-message
tags: [regression, m5]
# spec §Step 4 pre-fill: every field mentioned in the first message must be
# extracted and stored so no redundant question is asked afterward.
turns:
  - user: "I need a 7x14 dump trailer for hauling dirt, about 3 tons."
    expect_state:
      category: "Dump"
      "slot:trailer_length_ft": 14.0
      "slot:trailer_width_ft": 7.0
      "slot:haul_material": "dirt"
      "slot:haul_weight_lbs": 6000.0
    expect_reply_not_contains: ["what material", "how much weight", "rough haul weight"]
    expect_listings: false
