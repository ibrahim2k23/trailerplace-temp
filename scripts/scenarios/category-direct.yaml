name: category-direct
tags: [regression, m5]
# spec §Step 1 intent 3 (category selection) + §Step 2: an explicit category
# name begins qualification immediately.
turns:
  # The opening contact gate owns the first reply; satisfy it so the scenario's real
  # first message gets the substantive turn (scenarios predate the gate).
  - user: "I'm Marco, marco@example.com"
  - user: "I'm looking for a dump trailer."
    expect_state:
      category: "Dump"
    expect_reply_contains_any: ["haul", "material", "weight"]
