name: gooseneck-not-category
tags: [regression, m5]
# spec guard: Gooseneck and Bumper Pull are strictly hitch types, never
# categories or makes -- must never be inferred/returned as a category.
turns:
  # The opening contact gate owns the first reply; satisfy it so the scenario's real
  # first message gets the substantive turn (scenarios predate the gate).
  - user: "I'm Marco, marco@example.com"
  - user: "I want a gooseneck."
    expect_state:
      category: null
    # A recommendation list ending "which type would you like to go with?" also satisfies
    # the spec: gooseneck was not taken as a category and the type question was asked.
    expect_reply_contains_any: ["hitch", "type of trailer", "which category", "which type", "type would you like"]
