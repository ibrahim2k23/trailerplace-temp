name: adversarial-category-change-twice
tags: [regression, m9, adversarial]
# M9 adversarial: two explicit category switches in one conversation. Each switch
# applies IMMEDIATELY (so values stated in the same message land in the new
# category's slots) and then pauses on a pending_category_change to ask which
# carried-over measurements to keep. The second switch must not be blocked or
# confused by the first one's resolution.
turns:
  - user: "I'm Marco, marco@example.com"
  - user: "I want a dump trailer"
    expect_state:
      category: "Dump"
  - user: "it's for hauling gravel, about 3 tons"
    expect_state:
      category: "Dump"
  - user: "actually, show me tilt trailers instead"
    # The category moves at once; the reply is the keep/drop question for the carried payload.
    expect_state:
      category: "Tilt"
    expect_reply_contains_any: ["keep", "carry over", "still apply", "start"]
  - user: "keep all of them"
    expect_state:
      category: "Tilt"
      pending_category_change: null
  - user: "you know what, switch to equipment trailers"
    expect_state:
      category: "Equipment"
  - user: "none of them, start fresh"
    expect_state:
      category: "Equipment"
      pending_category_change: null
