name: inventory-lookup-then-interest
tags: [regression, m7]
# Locked Decision (inventory lookup): a first-turn lookup shows cards and defers the
# contact invite; expressing interest then flows through the contact gate to a
# Listing Interest email and a hard lead.
turns:
  - user: "How much is the 2026 Iron Bull FHG 24k?"
    expect_listings: true
    expect_emails_sent: null
  - user: "I'm interested in the first one. I'm Jane, jane@example.com."
    expect_reply_contains_any: ["logged", "follow up", "team"]
    # The stashed Results-Shown alert releases with the contact details, alongside the
    # Listing Interest email (locked decision: alerts stash silently until contact arrives).
    expect_emails_sent: ["Results Shown to User", "Listing Interest"]
