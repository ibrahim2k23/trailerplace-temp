# Build API image in Azure (ACR) and deploy to Container Apps on push to main.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS   JSON service principal (see Azure Cloud Shell steps below)
#   AZURE_SUBSCRIPTION_ID
#   AZURE_RESOURCE_GROUP
#   AZURE_ACR_NAME        Short ACR name only (e.g. trailerplaceacr), not the full login server
#   AZURE_CONTAINER_APP   API Container App resource name (e.g. trailerplace-api)
#
# Image name and Dockerfile are set in this file (env block). Change IMAGE_NAME if yours differs.

name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.api"
      - "main.py"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/deploy-trailerplace-api.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: trailerplace-api
  DOCKERFILE: Dockerfile.api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Resolve ACR login server
        id: acr
        run: |
          LOGIN=$(az acr show -n "${{ secrets.AZURE_ACR_NAME }}" -g "${{ secrets.AZURE_RESOURCE_GROUP }}" --query loginServer -o tsv)
          echo "login_server=$LOGIN" >> "$GITHUB_OUTPUT"

      - name: Build and push image (ACR Tasks)
        run: |
          az acr build \
            --registry "${{ secrets.AZURE_ACR_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file "${{ env.DOCKERFILE }}" \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
